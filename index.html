<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مُلخِّصاتي - رفيق المذاكرة الذكي</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --primary: #2f81f7;
      --primary-hover: #1f6feb;
      --success: #238636;
      --warning: #d29922;
      --danger: #da3633;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      line-height: 1.7; max-width: 850px; margin-inline: auto;
    }
    header {
      text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    header h1 { margin: 0; font-size: 1.6rem; color: #58a6ff; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 16px;
    }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
    input[type="password"], input[type="text"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #0d1117; color: var(--text); font-size: 0.95rem; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--primary); color: #fff; border: none; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.92rem;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #2ea043; }
    .btn-warning { background: #9e6a03; }
    .btn-warning:hover { background: var(--warning); }
    .btn-danger { background: var(--danger); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #21262d; }
    .file-box {
      border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center;
      cursor: pointer; transition: 0.2s;
    }
    .file-box:hover { border-color: var(--primary); background: rgba(47, 129, 247, 0.05); }
    .actions-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px;
    }
    #output-box {
      display: none; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-top: 16px;
    }
    #result-content h1, #result-content h2, #result-content h3 { color: #58a6ff; margin-top: 18px; }
    #result-content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    #result-content th, #result-content td { border: 1px solid var(--border); padding: 8px; text-align: right; }
    #result-content th { background: #21262d; }
    #result-content blockquote {
      border-right: 4px solid var(--warning); margin: 10px 0; padding: 8px 14px;
      background: rgba(210, 153, 34, 0.1); border-radius: 6px;
    }
    .loader {
      display: none; text-align: center; padding: 20px; color: #58a6ff; font-weight: bold;
    }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.82rem;
      background: rgba(35, 134, 54, 0.2); color: #3fb950; margin-top: 8px;
    }
    #speech-status {
      font-size: 0.85rem; color: #d29922; margin-bottom: 10px; display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 مُلخِّصاتي الذكي</h1>
    <p>ارفع ملف المادة، افهمها بالعامية وبأمثلة واقعية، اسمع الشرح، واختبر نفسك</p>
  </header>

  <!-- إعداد مفتاح API -->
  <div class="card">
    <label for="apiKey">🔑 مفتاح الذكاء الاصطناعي (Gemini API Key):</label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="الصق المفتاح هنا (AIza...)" style="flex: 1;" />
      <button onclick="saveKey()" class="btn-success">حفظ المفتاح</button>
    </div>
    <small id="keyStatus" style="color: var(--muted); display: block; margin-top: 6px;">بيتحفظ على جهازك مرة واحدة بس ومحدش غيرك بيشوفه.</small>
  </div>

  <!-- رفع ملف PDF -->
  <div class="card">
    <label>📄 ارفع ملف المادة (PDF):</label>
    <div class="file-box" onclick="document.getElementById('pdfFile').click()">
      <div style="font-size: 2rem;">📁</div>
      <div id="fileLabel">اضغط هنا لاختيار ملف PDF من جهازك</div>
      <input type="file" id="pdfFile" accept="application/pdf" style="display: none;" onchange="handleFileSelect(event)" />
    </div>
    <div id="fileInfo" style="text-align: center;"></div>

    <!-- أزرار الأوامر الجاهزة -->
    <div class="actions-grid">
      <button onclick="runPrompt('summary')" class="btn-success">🧠 لخص واشرح بالعامية</button>
      <button onclick="runPrompt('mcq')" class="btn-outline">☑️ أسئلة اختر (MCQ)</button>
      <button onclick="runPrompt('tf')" class="btn-outline">✔️❌ أسئلة صح وغلط</button>
      <button onclick="runPrompt('essay')" class="btn-outline">✍️ أسئلة مقالية</button>
    </div>

    <!-- سؤال مخصص -->
    <div style="margin-top: 14px;">
      <div class="row">
        <input type="text" id="customQuestion" placeholder="أو اكتب أي سؤال معين عايز تسأله في الملف..." style="flex: 1;" />
        <button onclick="runPrompt('custom')">اسأل 🚀</button>
      </div>
    </div>
  </div>

  <!-- مؤشر التحميل -->
  <div id="loader" class="loader">⏳ جاري قراءة الملف وتجهيز الشرح بالعامية... استنى ثواني</div>

  <!-- منطقة عرض النتيجة والصوت -->
  <div id="output-box">
    <div class="row" style="justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px;">
      <strong>📖 النتيجة:</strong>
      <div class="row">
        <button onclick="speakText()" class="btn-warning" id="speakBtn">🔊 اسمع الشرح</button>
        <button onclick="stopSpeech()" class="btn-danger">⏹️ إيقاف</button>
        <button onclick="copyResult()" class="btn-outline">📋 نسخ</button>
      </div>
    </div>
    <div id="speech-status"></div>
    <div id="result-content"></div>
  </div>

  <script>
    let pdfBase64 = null;
    let rawOutputText = "";
    let isSpeakingQueue = false;
    let speechChunks = [];
    let currentChunkIndex = 0;

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
        document.getElementById("keyStatus").innerHTML = "✅ المفتاح محفوظ وجاهز للاستخدام.";
        document.getElementById("keyStatus").style.color = "#3fb950";
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.getVoices();
      }
    };

    function saveKey() {
      const key = document.getElementById("apiKey").value.trim();
      if (!key) return alert("من فضلك حط الـ API Key الأول!");
      localStorage.setItem("gemini_api_key", key);
      document.getElementById("keyStatus").innerHTML = "✅ تم حفظ المفتاح بنجاح!";
      document.getElementById("keyStatus").style.color = "#3fb950";
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.type !== "application/pdf") {
        alert("من فضلك اختار ملف بصيغة PDF فقط.");
        return;
      }
      document.getElementById("fileLabel").innerText = file.name;
      document.getElementById("fileInfo").innerHTML = `<span class="status-badge">تم تحميل: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)</span>`;

      const reader = new FileReader();
      reader.onload = () => {
        pdfBase64 = reader.result.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    function getSystemInstruction(type) {
      const basePersona = `أنت دكتور جامعي شاطر جداً ودمك خفيف، بتشرح للطلبة في أي كلية (حقوق، طب، هندسة، تجارة، آداب، إلخ).
      قواعدك الأساسية:
      1. التزم بكل المعلومات الموجودة في ملف الـ PDF المرفق ولا تترك أي معلومة مهمة أو فرعية.
      2. اشرح بأسلوب سهل وبسيط ومنظم في نقاط واضحة وجداول مقارنة لو أمكن.
      3. بعد شرح كل نقطة أو قاعدة، اضرب مثال عملي بالعامية المصرية من الحياة اليومية (على طريقة أمثلة عم زغلول والمواقف الواقعية عشان المعلومة تثبت في الدماغ).`;

      if (type === "summary") {
        return basePersona + `\nالمطلوب دلوقتي: لخص الملف بالكامل من أوله لآخره من غير ما تسيب ولا معلومة، واشرح كل نقطة ببساطة مع مثال بالعامية المصرية بعدها مباشرة.`;
      } else if (type === "mcq") {
        return basePersona + `\nالمطلوب دلوقتي: اعمل امتحان شامل من قلب الملف بنظام (اختر من متعدد MCQ) لا يقل عن 10 أسئلة ذكية بتغطي كل أجزاء الملف، واكتب الإجابات الصحيحة مع شرح سبب الاختيار بالعامية في آخر الامتحان.`;
      } else if (type === "tf") {
        return basePersona + `\nالمطلوب دلوقتي: اعمل امتحان شامل من قلب الملف بنظام (صح أم خطأ) لا يقل عن 10 أسئلة دقيقة وفيها تريكات الامتحانات، واكتب الإجابات الصحيحة مع تصحيح الخطأ وشرحه بالعامية في الآخر.`;
      } else if (type === "essay") {
        return basePersona + `\nالمطلوب دلوقتي: طلع أهم الأسئلة المقالية المتوقعة في الامتحان من الملف ده، واكتب الإجابة النموذجية المنظمة لكل سؤال في عناصر واضحة وسهلة الحفظ.`;
      } else {
        const customQ = document.getElementById("customQuestion").value.trim();
        return basePersona + `\nسؤال الطالب عن الملف: ${customQ}`;
      }
    }

    async function runPrompt(type) {
      const apiKey = document.getElementById("apiKey").value.trim();
      if (!apiKey) return alert("⚠️ حط الـ API Key الأول فوق واضغط حفظ!");
      if (!pdfBase64) return alert("⚠️ ارفع ملف الـ PDF الأول!");
      if (type === "custom" && !document.getElementById("customQuestion").value.trim()) {
        return alert("⚠️ اكتب سؤالك في الخانة الأول!");
      }

      stopSpeech();
      document.getElementById("loader").style.display = "block";
      document.getElementById("output-box").style.display = "none";

      const promptText = getSystemInstruction(type);

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: "application/pdf", data: pdfBase64 } }
              ]
            }]
          })
        });

        const data = await response.json();
        document.getElementById("loader").style.display = "none";

        if (data.error) {
          alert("حصل خطأ: " + data.error.message);
          return;
        }

        rawOutputText = data.candidates[0].content.parts[0].text;
        document.getElementById("result-content").innerHTML = marked.parse(rawOutputText);
        document.getElementById("output-box").style.display = "block";
        document.getElementById("output-box").scrollIntoView({ behavior: "smooth" });

      } catch (err) {
        document.getElementById("loader").style.display = "none";
        alert("تأكد من اتصالك بالإنترنت وحاول تاني.\n" + err.message);
      }
    }

    function getArabicVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;
      return (
        voices.find(v => v.lang && v.lang.toLowerCase().includes("ar-eg")) ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ar")) ||
        null
      );
    }

    function splitIntoChunks(text, maxLen = 220) {
      const clean = text
        .replace(/[#*`_>-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      const sentences = clean.split(/([.!?؟،\n]+)/);
      const chunks = [];
      let current = "";

      for (let part of sentences) {
        if ((current + part).length > maxLen && current.trim()) {
          chunks.push(current.trim());
          current = part;
        } else {
          current += part;
        }
      }
      if (current.trim()) chunks.push(current.trim());
      return chunks;
    }

    function speakText() {
      if (!rawOutputText) return alert("مفيش شرح يتقرأ لسه!");
      if (!("speechSynthesis" in window)) {
        return alert("المتصفح ده مش بيدعم قراءة النصوص بالصوت.");
      }

      stopSpeech();
      speechChunks = splitIntoChunks(rawOutputText, 220);
      currentChunkIndex = 0;
      isSpeakingQueue = true;

      const statusEl = document.getElementById("speech-status");
      statusEl.style.display = "block";
      statusEl.innerText = "🔊 جاري تشغيل القراءة الصوتية...";

      playNextChunk();
    }

    function playNextChunk() {
      if (!isSpeakingQueue || currentChunkIndex >= speechChunks.length) {
        stopSpeech();
        return;
      }

      const chunk = speechChunks[currentChunkIndex];
      const utterance = new SpeechSynthesisUtterance(chunk);
      const voice = getArabicVoice();
      if (voice) utterance.voice = voice;
      utterance.lang = voice ? voice.lang : "ar-EG";
      utterance.rate = 1.0;

      const statusEl = document.getElementById("speech-status");
      statusEl.innerText = `🔊 بيقرأ جزء ${currentChunkIndex + 1} من ${speechChunks.length}...`;

      utterance.onend = () => {
        currentChunkIndex++;
        if (isSpeakingQueue) {
          setTimeout(playNextChunk, 120);
        }
      };

      utterance.onerror = () => {
        currentChunkIndex++;
        if (isSpeakingQueue && currentChunkIndex < speechChunks.length) {
          setTimeout(playNextChunk, 200);
        } else {
          stopSpeech();
        }
      };

      try {
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        statusEl.innerText = "⚠️ تعذر تشغيل الصوت على هذا الجهاز.";
      }
    }

    function stopSpeech() {
      isSpeakingQueue = false;
      currentChunkIndex = 0;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      const statusEl = document.getElementById("speech-status");
      if (statusEl) {
        statusEl.style.display = "none";
        statusEl.innerText = "";
      }
    }

    function copyResult() {
      navigator.clipboard.writeText(rawOutputText);
      alert("✅ تم نسخ الشرح!");
    }
  </script>
</body>
</html>
