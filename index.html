<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مُلخِّصاتي - رفيق المذاكرة الذكي</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --primary: #2f81f7;
      --primary-hover: #1f6feb;
      --success: #238636;
      --warning: #d29922;
      --danger: #da3633;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      line-height: 1.7; max-width: 850px; margin-inline: auto;
    }
    header {
      text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    header h1 { margin: 0; font-size: 1.6rem; color: #58a6ff; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 16px;
    }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
    input[type="password"], input[type="text"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #0d1117; color: var(--text); font-size: 0.95rem; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--primary); color: #fff; border: none; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.92rem;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #2ea043; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-warning:hover { background: #e3b341; }
    .btn-danger { background: var(--danger); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #21262d; }
    .file-box {
      border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center;
      cursor: pointer; transition: 0.2s;
    }
    .file-box:hover { border-color: var(--primary); background: rgba(47, 129, 247, 0.05); }
    .actions-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px;
    }
    #output-box {
      display: none; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-top: 16px;
    }
    #result-content h1, #result-content h2, #result-content h3 { color: #58a6ff; margin-top: 18px; }
    #result-content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    #result-content th, #result-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: right; }
    #result-content th { background: #21262d; }
    #result-content blockquote {
      border-right: 4px solid var(--warning); margin: 10px 0; padding: 8px 14px;
      background: rgba(210, 153, 34, 0.1); border-radius: 6px;
    }
    .loader {
      display: none; text-align: center; padding: 20px; color: #58a6ff; font-weight: bold;
    }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.82rem;
      background: rgba(35, 134, 54, 0.2); color: #3fb950; margin-top: 8px;
    }
    #speech-status {
      font-size: 0.85rem; color: #d29922; margin-bottom: 10px; display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>مُلخِّصاتي - رفيق المذاكرة الذكي</h1>
    <p>ارفع ملف PDF واختار طريقة المذاكرة أو التلخيص المبسط بالعامية المصرية</p>
  </header>

  <div class="card">
    <label for="apiKey">مفتاح Gemini API Key</label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="الصق مفتاح Gemini API Key هنا..." />
      <button class="btn-success" onclick="saveKey()">حفظ المفتاح</button>
    </div>
    <div id="keyStatus"></div>
  </div>

  <div class="card">
    <label>ملف المذاكرة (PDF)</label>
    <div class="file-box" onclick="document.getElementById('pdfFile').click()">
      <div id="fileLabel">اضغط هنا لاختيار ملف PDF</div>
      <div id="fileInfo"></div>
    </div>
    <input type="file" id="pdfFile" accept="application/pdf" style="display: none;" onchange="handleFileSelect(event)" />

    <div class="actions-grid">
      <button onclick="runPrompt('summary')">تلخيص شامل مبسط</button>
      <button onclick="runPrompt('mcq')">أسئلة اختيار من متعدد</button>
      <button onclick="runPrompt('tf')">أسئلة صح أو خطأ</button>
      <button onclick="runPrompt('essay')">أسئلة مقالية</button>
    </div>

    <div style="margin-top: 14px;">
      <label for="customQuestion">أو اسأل سؤالاً محدداً عن الملف</label>
      <div class="row">
        <input type="text" id="customQuestion" placeholder="اكتب سؤالك هنا..." />
        <button class="btn-warning" onclick="runPrompt('custom')">اسأل</button>
      </div>
    </div>
  </div>

  <div class="loader" id="loader">جاري التحليل والتلخيص بأسلوب مبسط... استنى لحظة</div>

  <div id="output-box">
    <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
      <div class="row">
        <button class="btn-success" onclick="speakText()">استماع صوتي</button>
        <button class="btn-outline" onclick="stopSpeech()">إيقاف الصوت</button>
      </div>
      <button class="btn-outline" onclick="copyResult()">نسخ النتيجة</button>
    </div>
    <div id="speech-status"></div>
    <div id="result-content"></div>
  </div>

  <script>
    let pdfBase64 = null;
    let rawOutputText = "";
    let isSpeakingQueue = false;
    let speechChunks = [];
    let currentChunkIndex = 0;

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
        document.getElementById("keyStatus").innerHTML = '<span class="status-badge">المفتاح محفوظ وجاهز للاستخدام</span>';
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.getVoices();
      }
    };

    function saveKey() {
      const key = document.getElementById("apiKey").value.trim();
      if (!key) return alert("من فضلك أدخل مفتاح API Key الأول");
      localStorage.setItem("gemini_api_key", key);
      document.getElementById("keyStatus").innerHTML = '<span class="status-badge">تم حفظ المفتاح بنجاح</span>';
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.type !== "application/pdf") {
        alert("من فضلك اختر ملف PDF فقط");
        return;
      }
      document.getElementById("fileLabel").innerText = file.name;
      document.getElementById("fileInfo").innerHTML = `<span class="status-badge">تم تحميل: ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>`;

      const reader = new FileReader();
      reader.onload = () => {
        pdfBase64 = reader.result.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    function getSystemInstruction(type) {
      const basePersona =
        "أنت دكتور جامعي شاطر جداً ومبسط ومباشر، تشرح للطلبة وتساعدهم يحفظوا بسرعة بدون تعقيد أو إطالة. " +
        "القواعد الأساسية:\n" +
        "1. التزم بكل معلومة وحكم ومادة وفرق موجود في ملف الـ PDF بالكامل، ولا تترك أي معلومة مهمة أو تسقط أي عنصر.\n" +
        "2. اشرح بأسلوب مبسط جداً ومختصر وواضح ومباشر في نقاط مرتبة يسهل حفظها ومراجعتها بسرعة بدون حشو أو تطويل.\n" +
        "3. بعد شرح كل نقطة أو فكرة، اضرب مثالاً عملياً قصيراً بالعامية المصرية من الحياة اليومية (على أسلوب أمثلة عم زغلول ومواقف الشارع والبيت والعمل) لتوضيح المعنى وتثبيته.\n";

      if (type === "summary") {
        return basePersona + "لخّص الملف بالكامل من أوله لآخره في نقاط مبسطة وسهلة الحفظ من غير ما تسيب ولا معلومة، واشرح كل نقطة ببساطة ومعاها مثال بالعامية المصرية بعدها مباشرة.";
      } else if (type === "mcq") {
        return basePersona + "ضع أسئلة اختيار من متعدد (MCQ) بأسلوب مبسط وواضح من قلب الملف بالكامل، واكتب الإجابة الصحيحة وسبب اختيارها ببساطة في الآخر.";
      } else if (type === "tf") {
        return basePersona + "ضع أسئلة صح أو خطأ مبسطة وواضحة من قلب الملف بالكامل، واكتب الإجابة الصحيحة مع تصحيح الخطأ وشرح السبب ببساطة.";
      } else if (type === "essay") {
        return basePersona + "ضع أسئلة مقالية مركزة ومبسطة من قلب الملف بالكامل، واكتب الإجابة النموذجية المختصرة في نقاط يسهل حفظها.";
      } else {
        const customQ = document.getElementById("customQuestion").value.trim();
        return basePersona + `أجب عن سؤال الطالب بناءً على الملف بأسلوب مبسط ومباشر مع مثال بالعامية المصرية: ${customQ}`;
      }
    }

    async function runPrompt(type) {
      const apiKey = document.getElementById("apiKey").value.trim();
      if (!apiKey) return alert("اكتب وحفظ مفتاح API Key الأول");
      if (!pdfBase64) return alert("ارفع ملف PDF الأول");
      if (type === "custom" && !document.getElementById("customQuestion").value.trim()) {
        return alert("اكتب سؤالك في الخانة الأول");
      }

      stopSpeech();
      document.getElementById("loader").style.display = "block";
      document.getElementById("output-box").style.display = "none";

      const promptText = getSystemInstruction(type);

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(apiKey), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { inline_data: { mime_type: "application/pdf", data: pdfBase64 } },
                { text: promptText }
              ]
            }]
          })
        });

        const data = await response.json();
        document.getElementById("loader").style.display = "none";

        if (data.error) {
          alert("خطأ من Gemini: " + data.error.message);
          return;
        }

        rawOutputText = data.candidates?.[0]?.content?.parts?.[0]?.text || "لم يتم استلام رد من النموذج";
        document.getElementById("result-content").innerHTML = marked.parse(rawOutputText);
        document.getElementById("output-box").style.display = "block";
      } catch (err) {
        document.getElementById("loader").style.display = "none";
        alert("حصل خطأ في الاتصال: " + err.message);
      }
    }

    function splitTextIntoChunks(text, maxLen = 220) {
      const clean = text.replace(/[#*`>|_-]+/g, " ").replace(/\s+/g, " ").trim();
      if (!clean) return [];
      const sentences = clean.match(/[^.!?؟\n]+[.!?؟\n]?/g) || [clean];
      const chunks = [];
      let current = "";
      for (const s of sentences) {
        if ((current + " " + s).trim().length <= maxLen) {
          current = (current + " " + s).trim();
        } else {
          if (current) chunks.push(current);
          current = s.trim();
        }
      }
      if (current) chunks.push(current);
      return chunks;
    }

    function speakText() {
      if (!("speechSynthesis" in window)) {
        return alert("المتصفح لا يدعم القراءة الصوتية");
      }
      stopSpeech();
      speechChunks = splitTextIntoChunks(rawOutputText);
      if (!speechChunks.length) return;

      isSpeakingQueue = true;
      currentChunkIndex = 0;
      document.getElementById("speech-status").style.display = "block";
      playNextChunk();
    }

    function playNextChunk() {
      if (!isSpeakingQueue || currentChunkIndex >= speechChunks.length) {
        stopSpeech();
        return;
      }

      const utter = new SpeechSynthesisUtterance(speechChunks[currentChunkIndex]);
      utter.lang = "ar-EG";
      const voices = window.speechSynthesis.getVoices();
      const arabicVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
      if (arabicVoice) utter.voice = arabicVoice;

      document.getElementById("speech-status").innerText = `جاري القراءة الصوتية (${currentChunkIndex + 1} / ${speechChunks.length})...`;

      utter.onend = () => {
        currentChunkIndex++;
        playNextChunk();
      };
      utter.onerror = () => {
        currentChunkIndex++;
        playNextChunk();
      };

      window.speechSynthesis.speak(utter);
    }

    function stopSpeech() {
      isSpeakingQueue = false;
      currentChunkIndex = 0;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById("speech-status").style.display = "none";
      document.getElementById("speech-status").innerText = "";
    }

    function copyResult() {
      if (!rawOutputText) return;
      navigator.clipboard.writeText(rawOutputText).then(() => {
        alert("تم نسخ التلخيص بنجاح");
      });
    }
  </script>
</body>
</html>
